    <main class="w-full h-[calc(100vh-75px)] bg-[url('./images/bg-travelreco-image.jpg')] bg-cover bg-center relative">
        <div class="main-page w-full h-full flex flex-row flex-wrap items-center justify-start p-0 px-30">
            <section class="text-content w-1/2 bg-[#000000]/0 p-4">
                <h1 class="text-5xl font-bold text-white mb-3">CONTACT US</h1>
                <p class="text-white text-xl mb-3 text-shadow-lg">Get in touch</p>
            </section>
            <section class="text-content w-1/2 bg-[#000000]/15 p-4 flex flex-row flex-wrap gap-0">
                <form id="contactForm" class="space-y-1 w-full text-white">
                    <!-- Name -->
                    <div class="mb-3">
                        <label for="name" class="block mb-0 font-semibold text-white">
                            Name
                        </label>
                        <input type="text" id="name" name="name"
                            class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <!-- Email -->
                    <div class="mb-3">
                        <label for="email" class="block mb-0 font-semibold text-white">
                            Email
                        </label>
                        <input type="email" id="email" name="email"
                            class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <!-- Message -->
                    <div class="mb-3">
                        <label for="message" class="block mb-0 font-semibold text-white">
                            Message
                        </label>
                        <textarea id="message" name="message" rows="5"
                            class="w-full rounded-lg border border-gray-300 px-4 py-3 resize-none focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                    </div>
                    <!-- Button -->
                    <button id="contactSubmitButton" type="submit" onclick=""
                        class="w-full bg-[#45817d] hover:bg-green-600 px-4 py-2 rounded-sm font-semibold transition text-xl text-white">
                        Submit
                    </button>
                </form>
            </section>
        </div>
        <div
            class="social-icons absolute left-0 top-[50%] -translate-y-[50%] w-[60px] flex flex-col text-white text-2xl items-center justify-center ml-2">
            <a href="#" class="w-[60px] h-[60px] flex items-center justify-center">

            <a href="#" class="w-[60px] h-[60px] flex items-center justify-center">
                <i class="fa-brands fa-youtube"></i>
            </a>
